aid: bart

name: Bart

description: Bay Area Rapid Transit (BART) provides public transit services across the San Francisco Bay Area. It offers real‑time departure information,
  schedule data, station details, fare information, and developer resources for building applications that integrate transit data. The BART API
  enables developers to access schedule, real‑time, and system information to create journey planners, alerts, and transit‑related services.

